<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Online | Fresh Bread by Iza - Get a Quote</title>
<meta name="description" content="Order fresh bread online. Get instant quote for quantity, delivery in City Bowl and pickup at 23 Kloof St.">
<meta name="keywords" content="order bread online, sourdough quote, bakery cape town">
<link rel="stylesheet" href="styles.css">
<style>
.error{color:#c0392b; font-size:0.8rem; display:block; margin:5px 0 10px;}
.field{margin-bottom:15px;}
.field input, .field select, .field textarea{width:100%; padding:12px; border-radius:12px; border:1px solid #ddd; font-family:inherit;}
#eqResult{display:none; background:#F5EFE6; border:2px solid #8B5A2B; padding:20px; border-radius:18px; margin-top:20px;}
</style>
</head>
<body>
<header class="header"><nav><a href="index.html">Home</a> <a href="menu.html">Menu</a> <a href="about.html">About</a> <a href="enquiry.html" style="font-weight:bold">Enquiry</a> <a href="contact.html">Contact</a></nav></header>

<section class="section" style="max-width:600px; margin:auto; padding:20px;">
<h2>Order / Enquiry</h2>
<p>Get a quick quote - reply within 24h via WhatsApp</p>

<form id="enquiryForm" novalidate>
  <div class="field">
    <label>Full Name *</label>
    <input type="text" id="eqName" required minlength="3" placeholder="Iza Customer">
    <small class="error" id="eqNameError"></small>
  </div>
  <div class="field">
    <label>Email *</label>
    <input type="email" id="eqEmail" required placeholder="you@email.com">
    <small class="error" id="eqEmailError"></small>
  </div>
  <div class="field">
    <label>WhatsApp Number *</label>
    <input type="tel" id="eqPhone" required pattern="^\+?[0-9 ]+$" placeholder="+27 82 123 4567">
    <small class="error" id="eqPhoneError"></small>
  </div>
  <div class="field">
    <label>Bread Type *</label>
    <select id="eqType" required>
      <option value="">-- Choose --</option>
      <option value="Sourdough Classic" data-price="65">Sourdough Classic - R65</option>
      <option value="Baguette" data-price="45">Baguette - R45</option>
      <option value="Croissant Box (6)" data-price="120">Croissants (6) - R120</option>
      <option value="Seeded Loaf" data-price="75">Seeded Loaf - R75</option>
      <option value="Ciabatta" data-price="55">Ciabatta - R55</option>
    </select>
    <small class="error" id="eqTypeError"></small>
  </div>
  <div class="field">
    <label>Quantity *</label>
    <input type="number" id="eqQty" min="1" max="50" value="1" required>
    <small class="error" id="eqQtyError"></small>
  </div>
  <div class="field">
    <label>Preferred Date *</label>
    <input type="date" id="eqDate" required>
  </div>
  <div class="field">
    <label>Message</label>
    <textarea id="eqMsg" rows="3" placeholder="e.g. 10 sourdough daily for office"></textarea>
  </div>
  <button type="submit" style="width:100%; padding:14px; background:#8B5A2B; color:white; border:none; border-radius:20px; cursor:pointer; font-weight:bold;">GET QUOTE - AJAX</button>
</form>

<div id="eqResult"></div>
</section>

<script>
document.getElementById('enquiryForm').addEventListener('submit', function(e){
  e.preventDefault();
  let valid = true;
  document.querySelectorAll('.error').forEach(el=>el.textContent='');
  
  const name = document.getElementById('eqName').value.trim();
  const email = document.getElementById('eqEmail').value.trim();
  const phone = document.getElementById('eqPhone').value.trim();
  const typeEl = document.getElementById('eqType');
  const qty = parseInt(document.getElementById('eqQty').value);
  const date = document.getElementById('eqDate').value;

  if(name.length < 3){ document.getElementById('eqNameError').textContent='Name must have at least 3 letters'; valid=false; }
  if(!/^\S+@\S+\.\S+$/.test(email)){ document.getElementById('eqEmailError').textContent='Enter valid email'; valid=false; }
  if(!phone){ document.getElementById('eqPhoneError').textContent='Enter WhatsApp number'; valid=false; }
  if(!typeEl.value){ document.getElementById('eqTypeError').textContent='Choose a bread type'; valid=false; }
  if(!qty || qty <1){ document.getElementById('eqQtyError').textContent='Quantity must be at least 1'; valid=false; }

  if(!valid) return;

  // CALCULATION - Requirement of professor
  let price = typeEl.options[typeEl.selectedIndex].dataset.price;
  let total = price * qty;
  let freeDelivery = total >= 200 ? "FREE DELIVERY in City Bowl!" : "Delivery R30 in City Bowl";

  // AJAX simulation - no page reload
  const result = document.getElementById('eqResult');
  result.style.display='block';
  result.innerHTML = `
    <h3>✅ Thank you ${name}! Iza will reply within 24h!</h3>
    <p><b>Order:</b> ${qty}x ${typeEl.value}</p>
    <p><b>Unit Price:</b> R${price} | <b>Total:</b> R${total}</p>
    <p><b>Date:</b> ${date || 'ASAP'}</p>
    <p><b>Delivery:</b> ${freeDelivery}</p>
    <p><b>Pickup:</b> 23 Kloof St, Cape Town - from 8am</p>
    <hr style="margin:10px 0">
    <p><i>Enquiry sent via AJAX - no page reload. We saved your request and will contact via WhatsApp ${phone}. No more lost DMs!</i></p>
  `;

  console.log('AJAX POST /api/enquiry', {name,email,phone,type:typeEl.value,qty,total});
  this.reset();
  result.scrollIntoView({behavior:'smooth'});
});
</script>
</body>
</html>

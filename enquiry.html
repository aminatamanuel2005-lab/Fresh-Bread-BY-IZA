<section class="section" style="max-width:750px">
<h2>Make an Enquiry</h2>
<p class="sub">For café orders, events or daily bread</p>
<div style="display:grid; grid-template-columns:1.1fr 0.7fr; gap:20px; margin-top:15px">
<form style="display:grid; gap:10px" onsubmit="alert('Thank you! Iza will reply on WhatsApp within 24h.'); return false;">
<input type="text" placeholder="Your Name" required style="padding:10px; border:1px solid #ddd; border-radius:10px; font-size:0.85rem">
<input type="email" placeholder="Your Email" required style="padding:10px; border:1px solid #ddd; border-radius:10px; font-size:0.85rem">
<input type="tel" placeholder="WhatsApp Number" style="padding:10px; border:1px solid #ddd; border-radius:10px; font-size:0.85rem">
<textarea rows="4" placeholder="Your order - e.g. 10 sourdough daily" required style="padding:10px; border:1px solid #ddd; border-radius:10px; font-size:0.85rem"></textarea>
<button class="btn btn-brown" style="border:none; cursor:pointer; width:100%">SEND ENQUIRY</button>
</form>
<div>
<img src="dough-balls.jpg" alt="Dough" style="width:100%; height:140px; object-fit:cover; border-radius:12px">
<p style="font-size:0.8rem; margin-top:10px; background:var(--beige); padding:10px; border-radius:10px"><b>Fast reply:</b><br>We reply within 24h on WhatsApp. No more lost DMs!</p>
</div>
</div>

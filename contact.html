<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Fresh Bread by Iza - Location & Hours</title>
<meta name="description" content="Find us at 23 Kloof St, Cape Town. Open 7am-4pm daily. Contact for wholesale and general questions.">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
.error{color:#c0392b; font-size:0.8rem; display:block; margin:5px 0 10px;}
#map{height:350px; width:100%; border-radius:18px; margin:20px 0;}
#contactForm input, #contactForm select, #contactForm textarea{width:100%; padding:12px; border-radius:12px; border:1px solid #ddd; margin-top:10px; font-family:inherit;} #map{height:400px; width:100%; border-radius:12px; margin:20px 0; display:block; background:#eee;}
</style>
</head>
<body>
<header class="header"><nav><a href="index.html">Home</a> <a href="menu.html">Menu</a> <a href="about.html">About</a> <a href="enquiry.html">Enquiry</a> <a href="contact.html" style="font-weight:bold">Contact</a></nav></header>

<section class="section" style="max-width:700px; margin:auto; padding:20px;">
<h2>Contact Us</h2>
<p>23 Kloof St, Cape Town - Open 7am to 4pm daily</p>

<!-- MAPA INTERATIVO LEAFLET - Requirement professor -->
<div id="map"></div>

<form id="contactForm" novalidate>
  <input type="text" id="cName" placeholder="Your Name *" required minlength="3">
  <small class="error" id="cNameError"></small>
  
  <input type="email" id="cEmail" placeholder="Your Email *" required>
  <small class="error" id="cEmailError"></small>
  
  <select id="cType" required>
    <option value="">Message Type *</option>
    <option value="General">General Question</option>
    <option value="Wholesale">Wholesale Enquiry</option>
    <option value="Feedback">Feedback</option>
  </select>
  <small class="error" id="cTypeError"></small>
  
  <textarea id="cMessage" placeholder="Your message (min 10 chars) *" required minlength="10" rows="4"></textarea>
  <small class="error" id="cMessageError"></small>
  
  <button type="submit" style="width:100%; padding:14px; background:#8B5A2B; color:white; border:none; border-radius:20px; cursor:pointer; font-weight:bold; margin-top:15px;">SEND MESSAGE</button>
</form>
<p id="cSuccess" style="display:none; color:green; font-weight:bold; margin-top:15px;"></p>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// LEAFLET MAP - Interactive map requirement
var map = L.map('map').setView([-33.9249, 18.4241], 16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap | Tiles © Esri',
    maxZoom: 19
}).addTo(map);
L.marker([-33.9249, 18.4241]).addTo(map).bindPopup('<b>Fresh Bread by Iza</b><br>23 Kloof St').openPopup();

// Fix para o mapa cinza
setTimeout(function(){ map.invalidateSize(); }, 500);

// CONTACT FORM - Validation + AJAX + Email
document.getElementById('contactForm').addEventListener('submit', function(e){
  e.preventDefault();
  let valid = true;
  document.querySelectorAll('.error').forEach(el=>el.textContent='');

  const name = document.getElementById('cName').value.trim();
  const email = document.getElementById('cEmail').value.trim();
  const type = document.getElementById('cType').value;
  const msg = document.getElementById('cMessage').value.trim();

  if(name.length <3){ document.getElementById('cNameError').textContent='Name min 3 letters'; valid=false; }
  if(!/^\S+@\S+\.\S+$/.test(email)){ document.getElementById('cEmailError').textContent='Valid email required'; valid=false; }
  if(!type){ document.getElementById('cTypeError').textContent='Select message type'; valid=false; }
  if(msg.length <10){ document.getElementById('cMessageError').textContent='Message min 10 chars'; valid=false; }

  if(!valid) return;

  // AJAX simulation
  console.log('AJAX POST /api/contact', {name,email,type,msg});
  document.getElementById('cSuccess').style.display='block';
  document.getElementById('cSuccess').textContent='Message sent! Opening email client...';

  // Email process - requirement
  setTimeout(()=>{
    let subject = `Contact - ${type} - from ${name}`;
    let body = `Name: ${name}%0D%0AEmail: ${email}%0D%0AType: ${type}%0D%0A%0D%0AMessage:%0D%0A${msg}`;
    window.location.href = `mailto:hello@freshbreadyiza.co.za?subject=${encodeURIComponent(subject)}&body=${body}`;
  }, 800);
});
</script>
</body>
</html>
